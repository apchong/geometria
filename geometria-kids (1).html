:root {
--ink: #1e2433;
--ink-soft: #4a5468;
--paper: #ffffff;
--sky: #dff1fb;
--sky-deep: #a9d3ea;
--sun: #ffc93c;
--hi: #ffb21a;
--leaf: #23824f;
--leaf-soft: #ddf3e5;
--amber: #c25e0c;
--amber-soft: #ffebd6;
--cobalt: #3557d6;
--cobalt-soft: #e3e9ff;
--display: 'Grandstander', 'Andika', 'Segoe UI', system-ui, sans-serif;
--font: 'Andika', 'Andika New Basic', 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
--gx: max(16px, env(safe-area-inset-left, 0px));
--gxr: max(16px, env(safe-area-inset-right, 0px));
--gt: max(14px, env(safe-area-inset-top, 0px));
--gb: max(14px, env(safe-area-inset-bottom, 0px));
--lift: 0 4px 0 var(--ink);
--t-xs: 15px;
--t-s: 18px;
--t-m: 22px;
--t-l: 30px;
--t-xl: 42px;
color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
margin: 0;
background: var(--sky);
color: var(--ink);
font-family: var(--font);
font-size: var(--t-s);
line-height: 1.35;
overflow: hidden;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 10px;
min-height: 60px; min-width: 60px; padding: 8px 20px;
background: var(--paper); color: var(--ink);
border: 3px solid var(--ink); border-radius: 18px;
box-shadow: var(--lift);
font-size: var(--t-m); font-weight: 700; cursor: pointer;
transition: transform .06s, box-shadow .06s;
user-select: none; -webkit-user-select: none;
}
.btn:active, .btn.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--sun); }
.btn.ok { background: var(--leaf-soft); }
.btn.quiet { box-shadow: none; border-width: 2px; min-height: 48px; font-size: var(--t-s); }
.btn.icon { padding: 0; width: 64px; height: 64px; border-radius: 50%; }
.btn.icon svg { width: 36px; height: 36px; }
.btn .ic { width: 34px; height: 34px; flex: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--cobalt); outline-offset: 3px; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#bar {
