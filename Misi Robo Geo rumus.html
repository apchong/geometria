<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Misi Robo Geo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,700&family=Lilita+One&display=swap">
<style>
/* Layout: one app column (max 1040px) on drafting-grid paper. Map = robot bay + mission list side by side, stacking under 780px. Level = figure board + question panel. */
:root{
  --paper:#EAF1F6; --grid:#D3E0EA; --panel:#FFFFFF; --panel-2:#F5F9FC;
  --ink:#1B2A41; --ink-soft:#4B5D75; --line:#AFC2D2;
  --key-border:#1B2A41; --key-edge:#1B2A41;
  --pencil:#FFC83D; --pencil-ink:#1B2A41;
  --ok:#137A50; --ok-bg:#DCF4E7; --bad:#C2363A; --bad-bg:#FCE4E4; --hint-bg:#FFF3C9; --hint-line:#E0BE4F;
  --vj:#D2372B; --vt:#1C5FC4; --vs:#0F8048;
  --f1:#FF9566; --f2:#80C3F2; --f3:#97DA8A; --f4:#FFD45C; --f5:#F6A6C8; --f6:#B9A8F2;
  --coin:#E7B33E; --sand:#E8C27A; --water:#9ED3F5; --snow:#FFFFFF;
  --stroke:#1B2A41; --shade:rgba(27,42,65,.16); --shine:rgba(255,255,255,.4); --scrim:rgba(12,22,38,.55);
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
  --font-math:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;
  --r-key:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A29; --grid:#172A40; --panel:#15253A; --panel-2:#1A2D45;
    --ink:#E7EFF7; --ink-soft:#A8BACE; --line:#38536F;
    --key-border:#5A7898; --key-edge:#050C16;
    --pencil:#FFC83D; --pencil-ink:#1B2A41;
    --ok:#5ED6A0; --ok-bg:#103828; --bad:#FF8585; --bad-bg:#3C1A22; --hint-bg:#322A10; --hint-line:#8F7525;
    --vj:#FF7B6E; --vt:#7DB2FF; --vs:#5BD995;
    --f1:#E8835A; --f2:#68AEDD; --f3:#7EC472; --f4:#E8BE4C; --f5:#DE8FB1; --f6:#9F8FDB;
    --coin:#D9A632; --sand:#D3AE68; --water:#5FA9D8; --snow:#F1F5F9;
    --stroke:#0A1320; --shade:rgba(0,0,0,.24); --shine:rgba(255,255,255,.22); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A29; --grid:#172A40; --panel:#15253A; --panel-2:#1A2D45;
  --ink:#E7EFF7; --ink-soft:#A8BACE; --line:#38536F;
  --key-border:#5A7898; --key-edge:#050C16;
  --pencil:#FFC83D; --pencil-ink:#1B2A41;
  --ok:#5ED6A0; --ok-bg:#103828; --bad:#FF8585; --bad-bg:#3C1A22; --hint-bg:#322A10; --hint-line:#8F7525;
  --vj:#FF7B6E; --vt:#7DB2FF; --vs:#5BD995;
  --f1:#E8835A; --f2:#68AEDD; --f3:#7EC472; --f4:#E8BE4C; --f5:#DE8FB1; --f6:#9F8FDB;
  --coin:#D9A632; --sand:#D3AE68; --water:#5FA9D8; --snow:#F1F5F9;
  --stroke:#0A1320; --shade:rgba(0,0,0,.24); --shine:rgba(255,255,255,.22); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--font-body); font-size:18px; line-height:1.5; min-height:100vh;
}
.app{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{text-wrap:balance}
.title{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,72px);line-height:.95;margin:0 0 14px;letter-spacing:.005em;color:var(--ink)}
.title-sm{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:24px;color:var(--ink)}
.brand svg{width:42px;height:42px}
.starcount{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--panel);border:2px solid var(--key-border);border-radius:999px;padding:4px 14px 4px 8px;font-variant-numeric:tabular-nums}
.starcount svg{width:24px;height:24px}

/* keys: chunky workshop buttons */
.key{font:inherit;color:var(--ink);background:var(--panel);border:2.5px solid var(--key-border);border-radius:var(--r-key);box-shadow:0 4px 0 var(--key-edge);padding:12px 16px;min-height:56px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s,background-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key:hover:not(:disabled){background:var(--panel-2)}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--key-edge)}
.key:focus-visible{outline:3px solid var(--vt);outline-offset:3px}
.key:disabled{cursor:default}
.key>svg{width:22px;height:22px;flex:none}
.key.go{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil-ink);box-shadow:0 4px 0 var(--pencil-ink);font-family:var(--font-display);font-size:22px;letter-spacing:.02em;padding:12px 26px}
.key.go:hover:not(:disabled){background:var(--pencil);filter:brightness(1.05)}
.key.sm{min-height:46px;padding:8px 14px;font-size:17px;font-weight:700}
.key.danger{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}

/* start */
.start{display:grid;gap:24px;align-items:center;padding-block:8px 24px}
@media (min-width:780px){.start{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.start-art svg{width:100%;max-width:380px;height:auto;display:block;margin-inline:auto}
.story{font-size:21px;max-width:34ch;margin:0 0 18px}
.howto{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-wrap:wrap;gap:10px}
.howto li{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:17px}
.howto svg{width:28px;height:28px}
.start-form label{display:block;font-weight:700;margin-bottom:6px}
.start-form .row{display:flex;flex-wrap:wrap;gap:12px}
.start-form input{flex:1 1 200px;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border:2.5px solid var(--key-border);border-radius:var(--r-key);background:var(--panel);color:var(--ink);min-height:56px}
.start-form input:focus-visible{outline:3px solid var(--vt);outline-offset:2px}
.src{color:var(--ink-soft);font-size:15px;margin:18px 0 0}

/* map */
.map{display:grid;gap:20px}
@media (min-width:780px){.map{grid-template-columns:300px minmax(0,1fr);align-items:start}}
.bay{background:var(--panel);border:2px solid var(--key-border);border-radius:20px;padding:16px;display:grid;gap:10px;justify-items:center}
.bay h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.bay .robot{width:100%;max-width:230px;height:auto}
.bay-n{margin:0;font-size:17px;color:var(--ink-soft)}
.bay-n b{color:var(--ink);font-size:22px}
.col-h{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 12px}
.missions{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.mis{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;padding:10px 16px 10px 12px;justify-content:stretch}
.mis-n{font-family:var(--font-display);font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--pencil);color:var(--pencil-ink);display:grid;place-items:center;border:2px solid var(--pencil-ink)}
.mis-n svg{width:20px;height:20px}
.mis-ic{width:58px;height:50px;display:block}
.mis-ic svg{width:100%;height:100%}
.mis-tx{min-width:0}
.mis-tx b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.15}
.mis-tx small{display:block;color:var(--ink-soft);font-size:15px}
.mis-st{display:flex;gap:2px}
.mis-st svg{width:22px;height:22px}
.mis:disabled{opacity:.6}
.mis:disabled .mis-n{background:var(--line);color:var(--ink)}
@media (max-width:480px){.mis{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}.mis-ic{display:none}.mis-st svg{width:18px;height:18px}}
.guru{margin-top:18px;background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:10px 14px}
.guru summary{cursor:pointer;font-weight:700;color:var(--ink-soft)}
.guru-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:10px}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.chk input{width:22px;height:22px}
.guru-note{flex-basis:100%;margin:0;font-size:15px;color:var(--ink-soft)}

/* level */
.lv-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:12px}
.back.warn{background:var(--bad-bg);border-color:var(--bad)}
.lv-title{display:grid;min-width:0}
.lv-title small{color:var(--ink-soft);font-size:15px;font-weight:700}
.lv-title b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1}
.lv-side{display:flex;align-items:center;gap:8px}
.mascot svg{width:54px;height:54px;display:block}
.combo{display:inline-flex;align-items:center;gap:4px;background:var(--f1);color:var(--pencil-ink);border:2px solid var(--stroke);border-radius:999px;padding:2px 10px 2px 6px;font-weight:700;font-size:17px}
.combo svg{width:20px;height:20px}
.combo.bump{animation:pop .35s}
.lv-prog{grid-column:1/-1;height:14px;background:var(--panel);border:2px solid var(--key-border);border-radius:999px;overflow:hidden}
.lv-prog span{display:block;height:100%;width:0;background:var(--ok);transition:width .45s}
.stage{background:var(--panel);border:2px solid var(--key-border);border-radius:20px;padding:18px}
.stage.enter{animation:rise .3s}
@media (max-width:520px){.stage{padding:12px}}

/* question layout */
.q{display:grid;gap:18px}
@media (min-width:780px){.q{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}.q-fig{position:sticky;top:12px}}
.q-fig{margin:0;border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background-color:var(--panel-2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.fig-in{display:grid;place-items:center;min-height:180px}
.fig-in>svg{width:100%;max-width:390px;height:auto}
.fig-in.revealed{animation:rise .4s}
.q-fig figcaption{font-size:16px;color:var(--ink-soft);text-align:center;font-weight:700}
.q-main{min-width:0}
.tag{justify-self:start;font-weight:700;font-size:15px;border-radius:999px;padding:3px 12px;border:2px solid var(--stroke);color:var(--pencil-ink)}
.tag-lp{background:var(--f2)} .tag-ip{background:var(--f1)}
.lead{font-size:20px;margin:0 0 14px;text-wrap:pretty}
.q-steps{display:grid;gap:4px}
.step{display:grid;gap:12px;padding-block:14px;border-top:2px dashed var(--line);animation:rise .3s}
.step:first-child{border-top:0;padding-top:0}
.step-q{font-family:var(--font-body);font-size:21px;font-weight:700;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{position:relative;flex-direction:column;font-size:20px;font-weight:700;text-align:center;min-height:64px;line-height:1.25}
.opt-ic{width:84px;height:66px;display:block}
.opt-ic svg{width:100%;height:100%}
.opts.fx .opt{font-size:25px}
.opts.fx.sm .opt{font-size:18px}
.opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.n4 .opt{font-family:var(--font-display);font-size:30px;font-weight:400}
.opts.yn .opt{font-size:24px;min-height:80px}
.opt.is-ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);animation:pop .35s}
.opt.is-bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt.is-pick{background:var(--hint-bg);border-color:var(--hint-line)}
.opt.is-ok::after,.opt.is-bad::after{position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--panel);font-family:var(--font-body)}
.opt.is-ok::after{content:"\2713";background:var(--ok)}
.opt.is-bad::after{content:"\2717";background:var(--bad)}
.opt:disabled:not(.is-ok):not(.is-bad):not(.is-pick){opacity:.5}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--hint-bg);border:2px solid var(--hint-line);border-radius:14px;padding:10px 14px;font-size:18px;animation:rise .25s}
.hint svg{flex:none;width:30px;height:30px}
.working{border:2px solid var(--ok);background:var(--ok-bg);border-radius:16px;padding:14px 16px;display:grid;gap:10px;animation:rise .3s;margin-top:8px}
.working h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--ok)}
.wk{display:grid;gap:4px;font-size:19px;font-variant-numeric:tabular-nums}
.working .key{justify-self:start}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* maths type */
var{font-family:var(--font-math);font-style:italic;font-weight:700}
.vj{color:var(--vj)} .vt{color:var(--vt)} .vs{color:var(--vs)}
.pi{font-family:var(--font-math)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.78em;line-height:1.05;text-align:center;margin:0 .1em;font-family:var(--font-body);font-weight:700}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .12em}

/* svg drawing classes */
.fl{stroke:none}
.ol{fill:none;stroke:var(--stroke);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ol.thin{stroke-width:1.5;opacity:.55}
.dk{fill:var(--shade)} .lt{fill:var(--shine)}
.hd{fill:none;stroke:var(--stroke);stroke-width:2;stroke-dasharray:6 5;opacity:.7}
.pc{stroke:var(--stroke);stroke-width:2.5;stroke-linejoin:round}
.net.tappable .pc{cursor:pointer}
.pc.mark{opacity:.55}
.tick{font:700 22px var(--font-body);fill:var(--ok);paint-order:stroke;stroke:var(--panel);stroke-width:4px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dim{color:var(--ink)} .d-j{color:var(--vj)} .d-t{color:var(--vt)} .d-s{color:var(--vs)}
.dim line{stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.dim .dot{fill:currentColor}
.dim text{fill:currentColor;font:700 16px var(--font-body);paint-order:stroke;stroke:var(--panel-2);stroke-width:5px;stroke-linejoin:round}
.it{font-family:var(--font-math);font-style:italic}
.ctext{font:700 14px var(--font-math);fill:var(--pencil-ink);text-anchor:middle;dominant-baseline:central}
.bigeq{font:400 44px var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.guide{stroke:var(--vt);stroke-width:2;stroke-dasharray:4 5;opacity:.8}
.pf{fill:var(--f2);stroke:var(--stroke);stroke-width:2;stroke-linejoin:round}
.pl{fill:none;stroke:var(--stroke);stroke-width:2.2;stroke-linecap:round}
.pd{fill:var(--vj)}
.st-on{fill:var(--f4);stroke:var(--stroke);stroke-width:1.5;stroke-linejoin:round}
.st-off{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round}

/* figures */
.emo{font-size:clamp(96px,22vw,140px);line-height:1.1}
.props{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.props li{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:19px}
.props svg{width:38px;height:38px;flex:none}
.reveal{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.reveal>svg{width:44%;height:auto}
.reveal .arw{width:40px;flex:none}
.duo{display:grid;gap:8px;width:100%;justify-items:center}
.duo>svg{width:100%;max-width:340px;height:auto}
.duo .cap{font-size:16px;font-weight:700;color:var(--ink-soft);text-align:center;margin:0}

/* counters */
.ctr{display:grid;gap:10px;margin-bottom:12px}
.ctr-eq{font-weight:700;font-size:20px}
.ctr-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid transparent}
.ctr-row.is-bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.ctr-row.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp .key{min-height:48px;width:48px;padding:0;font-size:26px;font-weight:700}
.stp output{min-width:40px;text-align:center;font-family:var(--font-display);font-size:32px;font-variant-numeric:tabular-nums}
.times{font-weight:700;font-size:22px}
.sw{width:34px;height:30px;flex:none}
.ctr-name{font-weight:700;font-size:18px}
.ctr-plus{font-weight:700;font-size:24px;padding-left:22px;line-height:1}

/* builder */
.bld-eq{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:21px;font-weight:700;margin-bottom:14px}
.slot{min-width:120px;min-height:64px;border:3px dashed var(--line);border-radius:14px;background:var(--panel-2);font:inherit;font-size:26px;display:inline-flex;align-items:center;justify-content:center;padding:4px 12px;cursor:pointer;color:var(--ink)}
.slot.full{border-style:solid;border-color:var(--key-border);background:var(--panel)}
.slot.is-bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.slot.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.slot:focus-visible{outline:3px solid var(--vt);outline-offset:2px}
.tray{display:flex;flex-wrap:wrap;gap:12px;padding:14px;border-radius:16px;background:var(--panel-2);border:2px solid var(--line);margin-bottom:14px}
.tile{font-size:24px;min-width:96px}
.tile.used{visibility:hidden}

/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media (max-width:600px){.mem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{aspect-ratio:4/5;max-width:100%;perspective:800px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;border-radius:14px}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.up .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:2.5px solid var(--key-border);display:grid;place-items:center;align-content:center;padding:6px;box-shadow:0 4px 0 var(--key-edge)}
.mc-back{background-color:var(--f2);background-image:linear-gradient(var(--shine) 1px,transparent 1px),linear-gradient(90deg,var(--shine) 1px,transparent 1px);background-size:12px 12px;font-family:var(--font-display);font-size:44px;color:var(--pencil-ink)}
.mc-front{background:var(--panel);transform:rotateY(180deg);gap:2px;font-weight:700;text-align:center;font-size:16px;line-height:1.2}
.mc-front.fx{font-size:20px}
.mc-front.fx.sm{font-size:14px}
.mc-ic{width:70%;max-width:76px;aspect-ratio:1/1}
.mc-ic svg{width:100%;height:100%}
.mc.match .mc-front{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.mc.nope .mc-front{border-color:var(--bad);background:var(--bad-bg)}
.mc:focus-visible{outline:3px solid var(--vt);outline-offset:3px}
.mem-stat{margin:0;font-weight:700;color:var(--ink-soft)}

/* lab scenes */
.coin{animation:drop .32s ease-out}
.pour .lvl{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .7s ease-out}
.pour .stream{opacity:0;transition:opacity .25s}
.pour .csand{transition:opacity .35s}
.pour.pouring .stream{opacity:1}
.pour.pouring .csand{opacity:.15}
.tally{display:flex;justify-content:center;gap:10px}
.tally span{width:30px;height:34px;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--line)}
.tally span.on{background:var(--sand);animation:pop .35s}
.pour-msg{font-size:19px;margin:0}

/* boss */
.boss{display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--key-border);border-radius:18px;padding:10px 14px;margin-bottom:14px}
.boss-face svg{width:76px;height:76px;display:block}
.boss-face.hit{animation:hit .45s}
.boss-face.laugh{animation:laugh .6s}
.boss-face.ko{animation:ko 1.2s forwards}
.boss-info{flex:1;min-width:0;display:grid;gap:6px}
.boss-info b{font-family:var(--font-display);font-weight:400;font-size:21px}
.hp{height:18px;border-radius:999px;border:2px solid var(--stroke);background:var(--panel-2);overflow:hidden}
.hp span{display:block;height:100%;width:100%;background:var(--bad);transition:width .45s}
.boss-n{font-weight:700;font-size:15px;color:var(--ink-soft)}

/* done + final */
.done,.final{display:grid;gap:24px;align-items:center;padding-block:8px 24px}
@media (min-width:780px){.done{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.done-art .robot,.cert-art .robot{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto}
.done-k{font-weight:700;color:var(--ink-soft);margin:0 0 4px;font-size:18px}
.stars-big{display:flex;gap:8px;margin-bottom:12px}
.stars-big span{display:inline-block;animation:starIn .5s both;animation-delay:calc(var(--i) * .25s)}
.stars-big svg{width:60px;height:60px}
.done-p{font-size:21px;margin:0 0 6px}
.done-m{margin:0 0 20px;color:var(--ink-soft)}
.done-act{display:flex;flex-wrap:wrap;gap:12px}
.cert{background:var(--panel);border:3px solid var(--key-border);border-radius:24px;padding:22px;display:grid;gap:18px;align-items:center;outline:2px dashed var(--line);outline-offset:-12px}
@media (min-width:780px){.cert{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}
.cert-name{font-family:var(--font-display);font-size:clamp(34px,6vw,52px);margin:4px 0 8px;color:var(--vt);line-height:1.05}
.cert-date{color:var(--ink-soft);margin:8px 0 0}
.cert-tx p{font-size:19px}

.rb-part:not(.on) .fl,.rb-part:not(.on) .lt,.rb-part:not(.on) .dk{fill:transparent}
.rb-part:not(.on) .ol{stroke:var(--line);stroke-dasharray:5 4}
.rb-part:not(.on) .rb-det{display:none}
.rb-part.new{animation:snap .8s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.scatter .rb-part{animation:float 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scatter [data-p="kepala"]{animation-delay:-.7s} .scatter [data-p="topi"]{animation-delay:-1.6s} .scatter [data-p="lengan"]{animation-delay:-2.2s} .scatter [data-p="kaki"]{animation-delay:-1.1s} .scatter [data-p="kasut"]{animation-delay:-2.8s}
.robot.dance{animation:dance .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.eye{fill:var(--stroke)}
.face .ey,.face .mo{display:none}
.face .ey{fill:none;stroke:var(--stroke);stroke-width:2.6;stroke-linecap:round}
.face .ey.n{fill:var(--stroke);stroke:none}
.face .mo{fill:none;stroke:var(--stroke);stroke-width:2.6;stroke-linecap:round}
[data-m="n"] .face .n,[data-m="h"] .face .h,[data-m="o"] .face .o{display:inline}
[data-m="h"] .face{animation:pop .4s}
[data-m="o"] .face{animation:shake .4s}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--panel);border:2.5px solid var(--key-border);border-radius:20px;width:min(780px,100%);max-height:100%;overflow:auto;padding:18px;display:grid;gap:14px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.tbl-wrap{overflow-x:auto}
table.kr{width:100%;border-collapse:collapse;min-width:540px;font-size:18px}
.kr th{text-align:left;font-size:15px;color:var(--ink-soft);padding:8px;border-bottom:2px solid var(--line)}
.kr td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.kr .nm{display:flex;align-items:center;gap:10px;font-weight:700}
.kr .nm svg{width:46px;height:40px;flex:none}
.kr .f{font-size:21px}
.tip{display:flex;gap:10px;align-items:center;margin:0;background:var(--hint-bg);border:2px solid var(--hint-line);border-radius:14px;padding:10px 14px}
.tip svg{width:30px;height:30px;flex:none}

/* feedback */
.cheer{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:50;font-family:var(--font-display);font-size:34px;color:var(--pencil-ink);background:var(--pencil);border:3px solid var(--pencil-ink);border-radius:16px;padding:6px 22px;box-shadow:0 5px 0 var(--pencil-ink);pointer-events:none;opacity:0;white-space:nowrap}
.cheer.show{animation:cheer 1.15s forwards}
.bit{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;z-index:49;pointer-events:none;border:1.5px solid var(--stroke);animation:bit .85s ease-out forwards}
.bit.tri{clip-path:polygon(50% 0,100% 100%,0 100%);border:0}
.bit.cir{border-radius:50%}
.bit.c1{background:var(--f1)} .bit.c2{background:var(--f2)} .bit.c3{background:var(--f3)} .bit.c4{background:var(--f4)} .bit.c5{background:var(--f5)} .bit.c6{background:var(--f6)}

@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}

@keyframes snap{0%{transform:translateY(-50px) scale(1.4);opacity:0}100%{transform:none;opacity:1}}

  const out = [{html:`${fmt(correct,dp)} ${unit}`, ok:true}];
  const seen = new Set([fmt(correct,dp)]);
  for (const [v, hint] of wrongs){
    if (!(v > 0)) continue;
    const k = fmt(v,dp); if (seen.has(k)) continue;
    seen.add(k); out.push({html:`${k} ${unit}`, ok:false, hint});
    if (out.length === 4) break;
  }
  const mult = [2, 0.5, 1.5, 3, 4, 0.25]; let m = 0;
  while (out.length < 4 && m < mult.length){
    const v = correct * mult[m++]; const k = fmt(v,dp);
    if (seen.has(k)) continue; seen.add(k);
    out.push({html:`${k} ${unit}`, ok:false, hint:'Semak semula setiap langkah darab.'});
  }
  return out;
}

const CHEERS = ['Betul!','Hebat!','Tepat!','Bagus!','Mantap!'];
const $ = (s, r) => (r || document).querySelector(s);

function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const motionOK = () => !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const hintHTML = t => `${IC.bulb}<span>${t}</span>`;
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function sr(t){ const s = $('#sr'); if (!s) return; s.textContent = ''; setTimeout(() => { s.textContent = t; }, 40); }

function setMood(m){ const f = $('#mascot'); if (!f) return; f.dataset.m = m; clearTimeout(setMood.t); setMood.t = setTimeout(() => { f.dataset.m = 'n'; }, 1300); }
function burst(target, n){
  if (!motionOK() || !target) return;
  n = n || 14;
  const r = target.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i=0;i<n;i++){
    const b = document.createElement('span');

    const a = Math.random()*Math.PI*2, d = 50 + Math.random()*100;
    b.style.left = cx + 'px'; b.style.top = cy + 'px';
    b.style.setProperty('--dx', (Math.cos(a)*d).toFixed(0) + 'px');
    b.style.setProperty('--dy', (Math.sin(a)*d - 30).toFixed(0) + 'px');
    b.style.setProperty('--rot', (Math.random()*540 - 270).toFixed(0) + 'deg');

}
function updateCombo(ctx){
  const c = $('#combo'); if (!c) return;
  if (ctx.combo >= 2){ c.hidden = false; c.querySelector('b').textContent = '×' + ctx.combo; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  else c.hidden = true;
}
function praise(ctx, btn, clean){
  if (clean) ctx.combo++;
  updateCombo(ctx);
  cheer(clean && ctx.combo >= 3 ? `${ctx.combo} berturut-turut!` : pick(CHEERS));

}
function scold(ctx){ ctx.mistakes++; ctx.combo = 0; updateCombo(ctx); setMood('o'); buzz([20,50,20]); }

  const b = goBtn('Teruskan', done); w.append(b); host.append(w);

/* steps: one question after another inside the same round */
function runSteps(host, steps, ctx, onDone){
  let i = 0;
  const next = () => {
    if (i >= steps.length) return onDone();
    const stp = steps[i];
    const sec = el(`<section class="step">${stp.prompt ? `<h3 class="step-q">${stp.prompt}</h3>` : ''}<div class="opts ${stp.cls || ''}"></div><div class="hint" role="status" hidden></div></section>`);
    host.append(sec);
    const optsEl = $('.opts', sec), hintEl = $('.hint', sec);
    let clean = true, closed = false;
    (stp.keepOrder ? stp.options : shuffle(stp.options)).forEach(o => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'key opt';
      b.innerHTML = (o.icon ? `<span class="opt-ic">${o.icon}</span>` : '') + `<span class="opt-tx">${o.html}</span>`;
      b.addEventListener('click', () => {
        if (closed || b.disabled) return;
        if (stp.any){
          closed = true; b.classList.add('is-pick');
          $$('.opt', optsEl).forEach(x => { x.disabled = true; });
          stp.onPick && stp.onPick(o.v);
          i++; setTimeout(next, 350); return;
        }
        if (o.ok){
          closed = true; b.classList.add('is-ok');
          $$('.opt', optsEl).forEach(x => { x.disabled = true; });
          hintEl.hidden = true;
          praise(ctx, b, clean);
          ctx.onStepOk && ctx.onStepOk();
          i++; setTimeout(next, 650);
        } else {
          b.classList.add('is-bad'); b.disabled = true; clean = false;
          scold(ctx);
          hintEl.innerHTML = hintHTML(o.hint || 'Belum tepat. Cuba lagi.');
          hintEl.hidden = false;
          ctx.onStepBad && ctx.onStepBad();
        }
      });
      optsEl.append(b);
    });
    if (i > 0) sec.scrollIntoView({behavior: motionOK() ? 'smooth' : 'auto', block:'nearest'});
  };
  next();
}

function quizRound(q){
  return { q, run(stage, ctx, done){
    stage.innerHTML = '';
    const wrap = el(`<div class="q">${q.figure ? `<figure class="q-fig">${q.tag ? `<span class="tag ${q.tag.cls}">${q.tag.text}</span>` : ''}<div class="fig-in">${q.figure}</div>${q.caption ? `<figcaption>${q.caption}</figcaption>` : ''}</figure>` : ''}<div class="q-main">${q.lead ? `<p class="lead">${q.lead}</p>` : ''}<div class="q-steps"></div></div></div>`);
    stage.append(wrap);
    const host = $('.q-steps', wrap);
    runSteps(host, q.steps, ctx, () => {
      if (q.reveal){ const fi = $('.fig-in', wrap); fi.innerHTML = q.reveal; fi.classList.add('revealed'); const fc = $('figcaption', wrap); if (fc) fc.textContent = 'Bentangan → bentuk 3D'; }

  }};
}

function memoryRound(pairs, title){
  return { kind:'memory', pairs, run(stage, ctx, done){
    stage.innerHTML = '';

      {id:i, html:`<span class="mc-ic">${shapeIcon(p.k)}</span><span>${SHAPES[p.k].name}</span>`, cls:''},
      {id:i, html:p.fx, cls:'fx' + (p.sm ? ' sm' : '')}]));
    let open = [], lock = false, moves = 0, matched = 0, misses = 0;
    cards.forEach(c => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mc'; b.setAttribute('aria-label','Kad tertutup');
      b.innerHTML = `<span class="mc-in"><span class="mc-back" aria-hidden="true">?</span><span class="mc-front ${c.cls}">${c.html}</span></span>`;

            b1.classList.add('match'); b2.classList.add('match'); b1.disabled = b2.disabled = true;

        } else {

function playLevel(n){
  const L = LEVELS[n-1];
  const rounds = L.build();
  const ctx = {n, mistakes:0, combo:0};
  const m = screen(`<section class="level">
    <header class="lv-head">
      <button type="button" class="key sm back" id="btnBack">${IC.back}<span>Peta</span></button>
      <div class="lv-title"><small>Misi ${n} daripada 6</small><b>${L.title}</b></div>
      <div class="lv-side"><span class="combo" id="combo" hidden>${IC.flame}<b></b></span><span class="mascot" id="mascot" data-m="n">${faceSVG()}</span></div>
      <div class="lv-prog" role="progressbar" aria-label="Kemajuan misi" aria-valuemin="0" aria-valuemax="${rounds.length}" aria-valuenow="0"><span></span></div>
    </header>
    ${L.boss ? `<div class="boss"><div class="boss-face" id="bossFace">${bossSVG()}</div><div class="boss-info"><b>Kiub Degil</b><div class="hp" role="progressbar" aria-label="Tenaga Kiub Degil" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span></span></div><span class="boss-n">Masalah <span id="bossN">1</span> / ${rounds.length}. Setiap jawapan betul melemahkan Kiub Degil.</span></div></div>` : ''}
    <div class="stage" id="stage"></div></section>`);
  const sid = SID;
  const back = $('#btnBack', m);
  back.addEventListener('click', () => {
    if (back.classList.contains('warn')) return showMap();
    back.classList.add('warn'); $('span', back).textContent = 'Keluar? Tekan lagi';
    setTimeout(() => { if (back.isConnected){ back.classList.remove('warn'); $('span', back).textContent = 'Peta'; } }, 3000);
  });
  if (L.boss){
    const total = rounds.reduce((a, r) => a + r.q.steps.length, 0);
    let hp = total;
    const bar = $('.hp span', m), hpEl = $('.hp', m), face = $('#bossFace', m);
    ctx.onStepOk = () => { hp = Math.max(0, hp-1); const pct = Math.round(hp/total*100); bar.style.width = pct + '%'; hpEl.setAttribute('aria-valuenow', pct); face.classList.remove('hit','laugh'); void face.offsetWidth; face.classList.add('hit'); };
    ctx.onStepBad = () => { face.classList.remove('hit','laugh'); void face.offsetWidth; face.classList.add('laugh'); };
  }
  const stage = $('#stage', m), prog = $('.lv-prog', m);
  let idx = 0;
  const advance = () => {
    if (sid !== SID) return;
    $('span', prog).style.width = (idx / rounds.length * 100) + '%';
    prog.setAttribute('aria-valuenow', idx);
    if (L.boss && idx < rounds.length) $('#bossN', m).textContent = idx + 1;
    if (idx >= rounds.length) return endLevel();
    stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
    rounds[idx].run(stage, ctx, () => { if (sid !== SID) return; idx++; advance(); });
    if (idx > 0) m.querySelector('.level').scrollIntoView({block:'start', behavior: motionOK() ? 'smooth' : 'auto'});
  };
  const endLevel = () => {
    if (L.boss){
      const face = $('#bossFace', m); face.classList.remove('hit','laugh'); face.classList.add('ko');
      cheer('Kiub Degil kalah!'); burst(face, 24);
      setTimeout(() => { if (sid === SID) finishLevel(n, ctx); }, 1400);
    } else finishLevel(n, ctx);
  };
  advance();
}

function finishLevel(n, ctx){
  const L = LEVELS[n-1];
  const stars = ctx.mistakes <= L.th[0] ? 3 : ctx.mistakes <= L.th[1] ? 2 : 1;

  S.stars[n] = Math.max(S.stars[n] || 0, stars); save(); renderTop();
  if (first && earned().size === 6) return showFinal();
  showDone(n, stars, first, ctx);
}
