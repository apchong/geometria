:root {
--ink: #1e2433;
--ink-soft: #4a5468;
--paper: #ffffff;
--sky: #cfe9f7;
--sun: #ffc93c;
--hi: #ffb21a;
--leaf: #23824f;
--leaf-soft: #ddf3e5;
--amber: #c25e0c;
--amber-soft: #ffebd6;
--cobalt: #3557d6;
--cobalt-soft: #e3e9ff;
--s0: #f2b51d; --s0s: #ffe6a3;
--s1: #4f9be8; --s1s: #cfe6ff;
--s2: #ec6f95; --s2s: #ffd5e1;
--s3: #3fb06a; --s3s: #cdf1da;
--display: 'Grandstander', 'Andika', 'Segoe UI', system-ui, sans-serif;
--font: 'Andika', 'Andika New Basic', 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
--gx: max(16px, env(safe-area-inset-left, 0px));
--gxr: max(16px, env(safe-area-inset-right, 0px));
--gt: max(10px, env(safe-area-inset-top, 0px));
--gb: max(12px, env(safe-area-inset-bottom, 0px));
--top-h: 0px;
--t-xs: 15px; --t-s: 18px; --t-m: 22px; --t-l: 30px; --t-xl: 42px;
color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font); font-size: var(--t-s); line-height: 1.35; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { position: fixed; inset: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--cobalt); outline-offset: 3px; }
body, button, input { overflow-wrap: normal; word-break: normal; hyphens: manual; }
.ic { display: inline-grid; place-items: center; }
.ic svg { width: 100%; height: 100%; }
#bg { position: fixed; inset: 0; z-index: 0; }
#bg .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: min(24vh, 210px); }
.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 10px;
min-height: 60px; min-width: 60px; padding: 8px 22px;
background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
font-family: var(--display); font-weight: 900; font-size: var(--t-m); cursor: pointer; user-select: none; -webkit-user-select: none;
transition: transform .08s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--sun); }
